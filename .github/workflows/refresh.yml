name: Daily refresh

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh trials and papers
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python3 refresh.py
      - name: Commit if anything changed
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Daily refresh: trials and new papers"
            git push
          else
            echo "No change"
          fi
